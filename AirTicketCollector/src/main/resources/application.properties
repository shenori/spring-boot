# ✅ application.properties — put this in src/main/resources/

# ── Database Connection (MySQL) ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/air_ticket_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# 'update' will auto-create or update tables based on your @Entity classes
# Use 'create-drop' during development to reset tables each restart

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
